[project]
name = "crypto-market-lab"
version = "0.1.0"
description = "Async public market-data clients for Binance, Bybit, and Kraken"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "connector-binance",
    "connector-bybit",
    "connector-kraken",
    "httpx>=0.27,<1",
    "pandas>=3.0.6",
]

[dependency-groups]
dev = ["ipykernel>=7.3.0", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
connector-binance = { workspace = true }
connector-bybit = { workspace = true }
connector-kraken = { workspace = true }
